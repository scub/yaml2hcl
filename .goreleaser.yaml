# .goreleaser.yaml
version: 2
project_name: yaml2hcl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/scub/yaml2hcl/cmd.version={{.Version}}
      - -X github.com/scub/yaml2hcl/cmd.commit={{.Commit}}
      - -X github.com/scub/yaml2hcl/cmd.date={{.Date}}

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: scub
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/scub/yaml2hcl"
    description: "CLI tool to monitor API health endpoints"
    license: "MIT"
    test: |
      system "#{bin}/yaml2hcl", "version"
    install: |
      bin.install "yaml2hcl"
